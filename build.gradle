buildscript {
    // CycloneDX's build-time graph also requests Guava before ordinary project configuration.
    def catalogs = project.extensions.getByType(VersionCatalogsExtension)
    def guava = catalogs.named('libs').findVersion('formatter-guava').get().requiredVersion
    configurations.classpath.resolutionStrategy.force("com.google.guava:guava:${guava}")
}

plugins {
    id 'base'
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.spotbugs) apply false
    alias(libs.plugins.cyclonedx) apply false
}

group = 'game.bullbear'
version = '0.1.0'

def formatterGuava = libs.versions.formatter.guava.get()
def coverage = [
    domain: [line: 0.90],
    application: [line: 0.90],
    presentation: [line: 0.10, branch: 0.08],
    desktop: [line: 0.65, branch: 0.55]
]

subprojects {
    group = rootProject.group
    version = rootProject.version

    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'
    apply plugin: 'com.github.spotbugs'

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    plugins.withId('java') {
        jacoco.toolVersion = libs.versions.jacoco.get()
        spotbugs {
            toolVersion = libs.versions.spotbugs.tool.get()
            reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
        }
        tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
            reports.create('xml') {
                required = true
            }
        }
        tasks.withType(JacocoReport).configureEach {
            dependsOn 'test'
            reports {
                xml.required = true
                html.required = true
            }
        }
        def thresholds = coverage[project.name]
        tasks.withType(JacocoCoverageVerification).configureEach {
            dependsOn 'test'
            violationRules {
                rule {
                    thresholds.each { counterName, threshold ->
                        limit {
                            counter = counterName.toUpperCase(Locale.ROOT)
                            value = 'COVEREDRATIO'
                            minimum = threshold
                        }
                    }
                }
            }
        }
        tasks.named('check') {
            dependsOn 'jacocoTestReport', 'jacocoTestCoverageVerification'
        }
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 21
            options.encoding = 'UTF-8'
        }
        tasks.withType(ProcessResources).configureEach {
            filteringCharset = 'UTF-8'
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            systemProperty 'file.encoding', 'UTF-8'
        }
        dependencies {
            testImplementation platform(libs.junit.bom)
            testImplementation libs.junit.jupiter
            testRuntimeOnly libs.junit.launcher
        }
        configurations.configureEach {
            if (name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath',
                         'jacocoAgent', 'jacocoAnt', 'spotbugs']) {
                resolutionStrategy.activateDependencyLocking()
            }
        }
        dependencyLocking {
            lockMode = LockMode.STRICT
        }
    }

    dependencies {
        components {
            // Spotless resolves formatters in detached configurations. Fix the formatter's
            // dependency metadata for GHSA-xxph-c9ww-hj94 before those graphs are resolved.
            withModule('com.google.googlejavaformat:google-java-format') { details ->
                details.allVariants { variant ->
                    variant.withDependencies { declared ->
                        declared.findAll { it.group == 'com.google.guava' && it.name == 'guava' }.each {
                            it.version { version -> version.require(formatterGuava) }
                        }
                    }
                }
            }
        }
    }

    spotless {
        java {
            googleJavaFormat(libs.versions.google.java.format.get()).aosp()
        }
    }
}

apply from: 'gradle/architecture.gradle'

tasks.named('check') {
    dependsOn 'verifyArchitecture', subprojects.collect { "${it.path}:check" }
}

tasks.named('assemble') {
    dependsOn subprojects.collect { "${it.path}:assemble" }
}
