name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contribution:
    name: Contribution policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/check_contribution.py

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean build :desktop:installDist
      - name: Build on macOS and Linux
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean build :desktop:installDist
      - name: Verify the macOS launcher first-thread option
        if: runner.os == 'macOS'
        run: grep -F -- '-XstartOnFirstThread' desktop/build/install/bullbear/bin/bullbear
      - name: Smoke-test the installed distribution in Xvfb
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          timeout 60s xvfb-run -a -s '-screen 0 1280x720x24' desktop/build/install/bullbear/bin/bullbear --smoke-test | tee "${RUNNER_TEMP}/bullbear-smoke.log"
          grep -Fx FOUNDATION_SMOKE_OK "${RUNNER_TEMP}/bullbear-smoke.log"
        shell: bash
      - name: Upload test and quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            */build/test-results/test/TEST-*.xml
            */build/reports/jacoco/test/
            */build/reports/spotbugs/
          if-no-files-found: warn
          retention-days: 7

  codeql:
    name: CodeQL Java analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: java-kotlin
          build-mode: none
          config-file: ./.github/codeql/java.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:java-kotlin

  dependency_review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  security:
    name: Local security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan pinned Maven coordinates
        run: python3 .github/scripts/audit_dependencies.py
      - name: Scan reachable Git history for secrets
        run: |
          work="$(mktemp -d)"
          curl --fail --silent --show-error --location 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' --output "$work/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$work/gitleaks.tar.gz" | sha256sum -c
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          "$work/gitleaks" git --redact --no-banner --log-opts=--all .
      - name: Upload advisory summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: advisory-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/security/osv.txt
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [build, contribution, codeql, dependency_review, security]
    if: ${{ always() }}
    steps:
      - name: Require every applicable check to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CONTRIBUTION_RESULT: ${{ needs.contribution.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$SECURITY_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$CONTRIBUTION_RESULT" = success
            test "$DEPENDENCY_REVIEW_RESULT" = success
          fi

  deliver:
    name: Deliver archive (${{ matrix.os }})
    if: ${{ !cancelled() && needs.gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon :desktop:distZip
      - name: Package macOS or Linux archive
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon :desktop:distZip
      - name: Create a SHA-256 file for the distribution
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          archive, = Path("desktop/build/distributions").glob("bullbear-*.zip")
          with archive.open("rb") as source:
              digest = hashlib.file_digest(source, "sha256").hexdigest()
          archive.with_suffix(".zip.sha256").write_text(
              f"{digest}  {archive.name}\n", encoding="ascii"
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullbear-${{ matrix.os }}-java21
          path: |
            desktop/build/distributions/bullbear-*.zip
            desktop/build/distributions/bullbear-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
