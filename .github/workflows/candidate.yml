name: Native release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric MAJOR.MINOR.PATCH matching the Gradle project version
        required: true
        type: string
      attest:
        description: Attest the verified candidate archives
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisory:
    name: Candidate Maven advisories
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/audit_dependencies.py

  package:
    name: Native candidate (${{ matrix.target }})
    needs: [advisory]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: windows-x64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true
      - name: Validate version and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = .\gradlew.bat -q :desktop:printAppVersion
          if ($LASTEXITCODE -ne 0 -or $version -cne $env:CANDIDATE_VERSION) { throw 'Candidate version differs from Gradle.' }
          .\gradlew.bat clean check :desktop:archiveAppImage :desktop:cyclonedxDirectBom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $launcher = (Resolve-Path 'desktop/build/native-image/Bullbear/Bullbear.exe').Path
          $process = Start-Process -FilePath $launcher -ArgumentList '--version' -WorkingDirectory $env:RUNNER_TEMP -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Bundled launcher version check failed.' }
      - name: Validate version and package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(./gradlew -q :desktop:printAppVersion)"
          test "$version" = "$CANDIDATE_VERSION"
          ./gradlew clean check :desktop:archiveAppImage :desktop:cyclonedxDirectBom
          if [ "$RUNNER_OS" = macOS ]; then
            launcher="$GITHUB_WORKSPACE/desktop/build/native-image/Bullbear.app/Contents/MacOS/Bullbear"
          else
            launcher="$GITHUB_WORKSPACE/desktop/build/native-image/Bullbear/bin/Bullbear"
          fi
          cd "$RUNNER_TEMP"
          "$launcher" --version
      - name: Create and verify checksums
        shell: bash
        run: |
          cp desktop/build/reports/cyclonedx-direct/bom.json desktop/build/candidate/bom.cdx.json
          jdk="$(java -version 2>&1 | sed -n '1p')"
          gradle="$(cat gradle/wrapper/gradle-wrapper.properties | sed -n 's|.*gradle-\(.*\)-bin.zip|\1|p')"
          python .github/scripts/candidate_manifest.py create desktop/build/candidate \
            --version "$CANDIDATE_VERSION" --target "$CANDIDATE_TARGET" --revision "$GITHUB_SHA" \
            --jdk "$jdk" --gradle "$gradle" --run "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop/build/candidate/
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest candidate (${{ matrix.target }})
    if: inputs.attest && github.ref == 'refs/heads/main' && github.ref_protected
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [windows-x64, macos-arm64, macos-x64, linux-x64]
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - run: python3 .github/scripts/candidate_manifest.py verify candidate --version "$CANDIDATE_VERSION" --target "$CANDIDATE_TARGET"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/bullbear-*.zip
            candidate/bullbear-*.tar.gz
